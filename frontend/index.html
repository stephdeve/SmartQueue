<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Titre et description principaux -->
    <title>SmartQueue - Solution de gestion de files d'attente intelligente</title>
    <meta name="description" content="SmartQueue transforme vos files d'attente physiques en expérience fluide : ticket à distance par QR code ou application mobile, position en temps réel et alerte quand le tour approche." />
    <meta name="keywords" content="gestion de files d'attente, ticket à distance, file d'attente virtuelle, optimisation flux, hôpital, banque, mairie, commerce, Bénin" />
    <meta name="author" content="SmartQueue" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook / LinkedIn
         (og:url, og:image et l'URL canonique sont à ajouter une fois le domaine définitif en ligne) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SmartQueue - Solution intelligente de gestion de files d'attente" />
    <meta property="og:description" content="Ticket à distance, position en temps réel et alertes au bon moment pour vos usagers ; tableau de bord et statistiques pour vos équipes." />
    <meta property="og:site_name" content="SmartQueue" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SmartQueue - Gestion de files d'attente intelligente" />
    <meta name="twitter:description" content="Ticket à distance, alertes au bon moment, et tableau de bord en temps réel pour optimiser vos flux." />

    <!-- Référencement local -->
    <meta name="geo.region" content="BJ" />
    <meta name="geo.placename" content="Bénin" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- JSON-LD / Schema.org : uniquement des informations vérifiables (aucune note ni
         coordonnée fictive, que les moteurs de recherche sanctionnent) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "SmartQueue",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Gestion de files d'attente",
        "description": "Solution de gestion de files d'attente avec ticket à distance, alertes et tableau de bord analytique.",
        "operatingSystem": "Web, iOS, Android",
        "offers": {
          "@type": "Offer",
          "price": "10000",
          "priceCurrency": "XOF",
          "description": "Offre Starter, par mois"
        },
        "featureList": [
          "Ticket à distance",
          "Ticket par QR code",
          "Tableau de bord en temps réel",
          "Statistiques d'affluence"
        ]
      }
    </script>
  </head>
  <body class="bg-gray-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Noscript fallback pour les moteurs de recherche qui n'exécutent pas JS -->
    <noscript>
      <div style="padding: 20px; text-align: center;">
        <h1>SmartQueue - Gestion de files d'attente intelligente</h1>
        <p>SmartQueue transforme vos files d'attente physiques en expérience fluide. Ticket à distance, alerte intelligente, arrivée au bon moment.</p>
        <p>Fonctionnalités :</p>
        <ul>
          <li>Ticket à distance par application mobile ou QR code</li>
          <li>Position et attente estimée en temps réel</li>
          <li>Tableau de bord et statistiques pour les établissements</li>
        </ul>
        <p>Activez JavaScript pour utiliser SmartQueue.</p>
      </div>
    </noscript>
  </body>
</html>
